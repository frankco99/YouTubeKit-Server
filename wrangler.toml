name = "youtubekitserver"
main = "src/index.ts"
compatibility_date = "2025-05-03"

[limits]
cpu_ms = 5000

[observability]
enabled = true

[vars]
RATE_LIMIT_DAILY_REQUESTS = "500000"
RATE_LIMIT_WEEKLY_REQUESTS = "2000000"

# Existing rate limiter DO
[[durable_objects.bindings]]
name = "APP_RATE_LIMITER"
class_name = "AppRateLimiter"

# New: poll session DO (one instance per watchOS request)
[[durable_objects.bindings]]
name = "POLL_SESSION"
class_name = "PollSessionObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppRateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PollSessionObject"]

# Production environment --------------------------------------------------------
[env.production]
name = "youtubekit-server-production"

[env.production.vars]
RATE_LIMIT_DAILY_REQUESTS = "500000"
RATE_LIMIT_WEEKLY_REQUESTS = "2000000"

[[env.production.durable_objects.bindings]]
name = "APP_RATE_LIMITER"
class_name = "AppRateLimiter"

[[env.production.durable_objects.bindings]]
name = "POLL_SESSION"
class_name = "PollSessionObject"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["AppRateLimiter"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["PollSessionObject"]
